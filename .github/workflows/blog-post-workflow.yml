name: Latest DEV.to Articles

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger at any time

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest DEV.to articles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest DEV.to posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://dev.to/feed/dj29"
          max_post_count: 5
          template: "$newline- [$title]($url) - $date"
