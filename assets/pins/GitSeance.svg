<svg xmlns="http://www.w3.org/2000/svg" width="400" height="135" viewBox="0 0 400 135" fill="none">
  <defs>
    <linearGradient id="bg_GitSance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E2C" />
      <stop offset="100%" stop-color="#030616" />
    </linearGradient>
    <linearGradient id="border_GitSance" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background Card with Cosmic Border -->
  <rect x="1" y="1" width="398" height="133" rx="10" fill="url(#bg_GitSance)" stroke="url(#border_GitSance)" stroke-width="1.5" />

  <!-- Repo Icon -->
  <g transform="translate(18, 20)">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4 9H3V8h1v1zm0-3H3v1h1V6zm0-3H3v1h1V3zm5-1.75A.75.75 0 019.75 2H13.5A1.5 1.5 0 0115 3.5v9A1.5 1.5 0 0113.5 14H2.5A2.5 2.5 0 010 11.5v-9A2.5 2.5 0 012.5 0h1.75a.75.75 0 010 1.5H2.5a1 1 0 00-1 1v9a1 1 0 001 1h11a.5.5 0 00.5-.5v-9a.5.5 0 00-.5-.5H9.75A.75.75 0 019 1.25z" fill="#F59E0B" transform="scale(1.15)" />
    <!-- Title -->
    <text x="24" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#FCD34D">GitSéance</text>
  </g>

  <!-- Award / Domain Pill -->
  <g transform="translate(217.4, 16)">
    <rect width="167.6" height="20" rx="10" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.45" stroke-width="1" />
    <text x="83.8" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#FDE68A">🔮 AI Code Necromancer</text>
  </g>

  <!-- Description -->
  <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">Channels author commits via AST analysis to demystify</text>
  <text x="18" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#94A3B8">terrifying legacy // DO NOT TOUCH codebase files.</text>

  <!-- Divider Line -->
  <line x1="18" y1="98" x2="382" y2="98" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6" />

  <!-- Footer -->
  <g transform="translate(18, 117)">
    <circle cx="5" cy="-4" r="4.5" fill="#3178C6" />
    <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="500" fill="#CBD5E1">TypeScript / AST</text>

    <!-- Star Glow Icon & Uplink Text -->
    <g transform="translate(364, 0)">
      <text x="0" y="0" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#F59E0B">✦ Launch Orbiter →</text>
    </g>
  </g>
</svg>