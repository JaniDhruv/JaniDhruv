<svg width="1200" height="72" viewBox="0 0 1200 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated cosmic orbital divider">
  <defs>
    <linearGradient id="line" x1="0" y1="36" x2="1200" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset=".22" stop-color="#38BDF8" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#FBBF24"/>
      <stop offset=".78" stop-color="#A78BFA" stop-opacity=".75"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .twinkle { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .core { animation: pulse 4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .shooting-star { opacity: 0; animation: shooting-star 8s linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.25); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes shooting-star { 0%, 2% { opacity: 0; transform: translateX(0); } 5% { opacity: 1; } 16%, 100% { opacity: 0; transform: translateX(1060px); } }
  </style>
  <rect width="1200" height="72" fill="#020617"/>
  <path d="M0 36H1200" stroke="url(#line)" stroke-width="1.5" filter="url(#glow)"/>
  <path d="M0 36H1200" stroke="url(#line)" stroke-width=".6"/>
  <g fill="#F8FAFC">
    <circle class="twinkle" cx="110" cy="25" r="1.3" fill="#FDE68A"/>
    <circle class="twinkle" cx="255" cy="48" r="1" fill="#A5B4FC" style="animation-delay:-1s"/>
    <circle class="twinkle" cx="405" cy="22" r="1.2" fill="#7DD3FC" style="animation-delay:-2s"/>
    <circle class="twinkle" cx="790" cy="50" r="1.2" fill="#F9A8D4" style="animation-delay:-1.5s"/>
    <circle class="twinkle" cx="950" cy="24" r="1" fill="#FDE68A" style="animation-delay:-.6s"/>
    <circle class="twinkle" cx="1100" cy="47" r="1.4" fill="#A5B4FC" style="animation-delay:-2.3s"/>
  </g>
  <g class="shooting-star" transform="translate(0 10)">
    <line x1="-70" y1="0" x2="0" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <circle cx="600" cy="36" r="22" fill="#FBBF24" fill-opacity=".12"/>
  <ellipse cx="600" cy="36" rx="118" ry="25" stroke="#38BDF8" stroke-opacity=".5"/>
  <ellipse cx="600" cy="36" rx="66" ry="25" transform="rotate(-18 600 36)" stroke="#A78BFA" stroke-opacity=".55"/>
  <path class="core" filter="url(#glow)" fill="#FBBF24" d="M600 20L605 31L616 36L605 41L600 52L595 41L584 36L595 31L600 20Z"/>
  <circle cx="600" cy="36" r="2" fill="#FFFFFF"/>
</svg>
